<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbosa Licitações | Assessoria, Licitações e Produções Culturais</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
    <div id="app" class="flex flex-col min-h-screen">

        <!-- Tela de Login em Destaque com a Logo -->
        <div v-if="!carregandoSessao && !usuario" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-b from-slate-900 via-slate-950 to-slate-950">
            <div class="w-full max-w-md bg-slate-900/95 border border-slate-800 rounded-2xl p-7 shadow-2xl space-y-6">
                <div class="flex flex-col items-center text-center space-y-3">
                    <label title="Clique para carregar ou trocar a logo" class="w-56 h-32 px-5 py-3 rounded-2xl bg-white border-2 border-emerald-500/50 flex items-center justify-center overflow-hidden shadow-xl cursor-pointer hover:border-emerald-400 transition">
                        <img :src="logoSrc" @error="onLogoError" alt="Logo Barbosa Licitações" class="max-h-28 w-auto object-contain">
                        <input type="file" accept="image/*" @change="carregarLogoLocal" class="hidden">
                    </label>
                    <div>
                        <h1 class="text-2xl font-bold tracking-tight text-white">Barbosa Licitações</h1>
                        <p class="text-xs text-emerald-400 font-semibold uppercase tracking-wider mt-0.5">
                            Assessoria, Licitações Públicas & Produções Culturais
                        </p>
                    </div>
                </div>

                <form @submit.prevent="fazerLogin" class="space-y-4 text-sm">
                    <div>
                        <label class="block text-slate-300 text-xs font-semibold mb-1">E-mail de Acesso</label>
                        <input type="email" v-model="loginForm.email" required placeholder="seu@email.com"
                            class="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded-xl px-3.5 py-2.5 text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-slate-300 text-xs font-semibold mb-1">Senha</label>
                        <input type="password" v-model="loginForm.senha" required placeholder="••••••••"
                            class="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded-xl px-3.5 py-2.5 text-white focus:outline-none">
                    </div>

                    <div v-if="erroAuth" class="bg-rose-950/70 border border-rose-500/50 text-rose-300 text-xs rounded-xl px-3.5 py-2.5">
                        {{ erroAuth }}
                    </div>

                    <button type="submit" :disabled="enviandoAuth"
                        class="w-full bg-emerald-600 hover:bg-emerald-500 disabled:opacity-60 text-white font-semibold py-2.5 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-950/60">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        {{ enviandoAuth ? 'Entrando...' : 'Entrar no Sistema' }}
                    </button>
                </form>
            </div>
        </div>

        <!-- Tela Obrigatória de Troca de Senha no Primeiro Acesso -->
        <div v-else-if="!carregandoSessao && usuario && usuario.precisa_trocar_senha" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-b from-slate-900 via-slate-950 to-slate-950">
            <div class="w-full max-w-md bg-slate-900 border border-amber-500/40 rounded-2xl p-7 shadow-2xl space-y-5">
                <div class="flex flex-col items-center text-center space-y-3">
                    <div class="w-44 h-24 px-4 py-2 rounded-xl bg-white border border-amber-400/50 flex items-center justify-center overflow-hidden shadow-md">
                        <img :src="logoSrc" @error="onLogoError" alt="Logo Barbosa Licitações" class="max-h-20 w-auto object-contain">
                    </div>
                    <div>
                        <span class="inline-block text-[11px] font-semibold bg-amber-500/15 text-amber-300 border border-amber-500/30 px-2.5 py-0.5 rounded-full">
                            Primeiro Acesso
                        </span>
                        <h2 class="text-xl font-bold text-white mt-2">Defina sua Nova Senha</h2>
                        <p class="text-xs text-slate-400 mt-1">
                            Olá, <span class="text-slate-200 font-medium">{{ usuario.nome }}</span>. Por segurança, troque sua senha provisória para continuar.
                        </p>
                    </div>
                </div>

                <form @submit.prevent="salvarNovaSenha" class="space-y-3.5 text-sm">
                    <div>
                        <label class="block text-slate-300 text-xs font-semibold mb-1">Nova Senha (mín. 6 caracteres)</label>
                        <input type="password" v-model="senhaForm.novaSenha" required minlength="6" placeholder="Digite a nova senha"
                            class="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded-xl px-3.5 py-2.5 text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-slate-300 text-xs font-semibold mb-1">Confirmar Nova Senha</label>
                        <input type="password" v-model="senhaForm.confirmarSenha" required minlength="6" placeholder="Repita a nova senha"
                            class="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded-xl px-3.5 py-2.5 text-white focus:outline-none">
                    </div>

                    <div v-if="erroSenha" class="bg-rose-950/70 border border-rose-500/50 text-rose-300 text-xs rounded-xl px-3.5 py-2.5">
                        {{ erroSenha }}
                    </div>

                    <button type="submit" :disabled="enviandoSenha"
                        class="w-full bg-emerald-600 hover:bg-emerald-500 disabled:opacity-60 text-white font-semibold py-2.5 rounded-xl transition">
                        {{ enviandoSenha ? 'Salvando...' : 'Salvar Senha e Acessar' }}
                    </button>
                </form>

                <div class="text-center pt-1">
                    <button @click="sair" class="text-xs text-slate-400 hover:text-white underline">Sair da conta</button>
                </div>
            </div>
        </div>

        <!-- Sistema Principal -->
        <template v-else-if="!carregandoSessao && usuario">
            <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 space-y-3">
                <div class="flex flex-wrap items-center justify-between gap-4">
                    <div class="flex items-center gap-4">
                        <label title="Clique para carregar ou trocar a logo" class="h-16 px-3 rounded-xl bg-white border border-emerald-500/40 flex items-center justify-center overflow-hidden shadow-md cursor-pointer hover:border-emerald-400 transition">
                            <img :src="logoSrc" @error="onLogoError" alt="Barbosa Licitações" class="h-14 w-auto object-contain">
                            <input type="file" accept="image/*" @change="carregarLogoLocal" class="hidden">
                        </label>
                        <div>
                            <h1 class="text-2xl font-bold tracking-tight text-white">Barbosa Licitações</h1>
                            <p class="text-xs text-emerald-400 font-medium">Assessoria, Licitações Públicas & Produções Culturais</p>
                        </div>
                    </div>

                    <div class="flex flex-wrap items-center gap-3">
                        <!-- Abas Principais dos Módulos -->
                        <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800 gap-1">
                            <button v-if="podeAcessarLicitacoes" @click="selecionarModuloPrincipal('licitacoes')"
                                :class="moduloPrincipal === 'licitacoes' && abaAtiva !== 'usuarios' ? 'bg-emerald-600 text-white font-semibold shadow' : 'text-slate-400 hover:text-white'"
                                class="px-4 py-2 rounded-lg text-sm transition flex items-center gap-2">
                                <i class="fa-solid fa-gavel"></i> Licitações
                            </button>
                            <button v-if="podeAcessarCultural" @click="selecionarModuloPrincipal('cultural')"
                                :class="moduloPrincipal === 'cultural' && abaAtiva !== 'usuarios' ? 'bg-amber-600 text-white font-semibold shadow' : 'text-slate-400 hover:text-white'"
                                class="px-4 py-2 rounded-lg text-sm transition flex items-center gap-2">
                                <i class="fa-solid fa-masks-theater"></i> Produções Culturais
                            </button>
                            <button v-if="isAdmin" @click="abrirAbaUsuarios"
                                :class="abaAtiva === 'usuarios' ? 'bg-sky-600 text-white font-semibold shadow' : 'text-slate-400 hover:text-white'"
                                class="px-4 py-2 rounded-lg text-sm transition flex items-center gap-2">
                                <i class="fa-solid fa-users-gear"></i> Admin
                            </button>
                        </div>

                        <div class="flex items-center gap-2.5 bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs">
                            <div class="text-right">
                                <div class="font-semibold text-white">{{ usuario.nome }}</div>
                                <div :class="isAdmin ? 'text-emerald-400' : 'text-sky-400'" class="uppercase text-[10px] font-bold">
                                    {{ isAdmin ? 'Administrador' : 'Somente Visualização' }}
                                </div>
                            </div>
                            <button @click="sair" title="Sair" class="text-slate-400 hover:text-rose-400 p-1.5 rounded-lg hover:bg-slate-900 transition">
                                <i class="fa-solid fa-right-from-bracket"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Sub-navegação interna do módulo ativo -->
                <div v-if="abaAtiva !== 'usuarios'" class="flex flex-wrap items-center justify-between gap-3 pt-1 border-t border-slate-800/70">
                    <nav v-if="moduloPrincipal === 'licitacoes' && podeAcessarLicitacoes" class="flex flex-wrap bg-slate-950 p-1 rounded-lg border border-slate-800">
                        <button @click="abaAtiva = 'licitacoes'"
                            :class="abaAtiva === 'licitacoes' ? 'bg-emerald-600 text-white font-semibold' : 'text-slate-400 hover:text-white'"
                            class="px-3.5 py-1.5 rounded-md text-xs transition flex items-center gap-2">
                            <i class="fa-solid fa-file-contract"></i> Pregões & Editais
                        </button>
                        <button @click="abaAtiva = 'clientes'"
                            :class="abaAtiva === 'clientes' ? 'bg-emerald-600 text-white font-semibold' : 'text-slate-400 hover:text-white'"
                            class="px-3.5 py-1.5 rounded-md text-xs transition flex items-center gap-2">
                            <i class="fa-solid fa-building"></i> Clientes & CNDs
                        </button>
                        <button @click="abaAtiva = 'calculadora'"
                            :class="abaAtiva === 'calculadora' ? 'bg-emerald-600 text-white font-semibold' : 'text-slate-400 hover:text-white'"
                            class="px-3.5 py-1.5 rounded-md text-xs transition flex items-center gap-2">
                            <i class="fa-solid fa-calculator"></i> Calculadora
                        </button>
                    </nav>

                    <nav v-if="moduloPrincipal === 'cultural' && podeAcessarCultural" class="flex flex-wrap bg-slate-950 p-1 rounded-lg border border-slate-800">
                        <button @click="abaAtiva = 'cultural'"
                            :class="abaAtiva === 'cultural' ? 'bg-amber-600 text-white font-semibold' : 'text-slate-400 hover:text-white'"
                            class="px-3.5 py-1.5 rounded-md text-xs transition flex items-center gap-2">
                            <i class="fa-solid fa-clapperboard"></i> Projetos Culturais & Editais
                        </button>
                    </nav>

                    <div class="text-[11px] text-slate-400">
                        Módulo ativo:
                        <strong v-if="moduloPrincipal === 'licitacoes'" class="text-emerald-400">Licitações Públicas</strong>
                        <strong v-else class="text-amber-400">Produções Culturais (RS)</strong>
                    </div>
                </div>
            </header>

            <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-6">

                <div v-if="!isAdmin" class="bg-sky-950/40 border border-sky-500/30 text-sky-200 rounded-xl px-4 py-2.5 text-xs flex items-center gap-2">
                    <i class="fa-solid fa-eye text-sky-400"></i>
                    <span>Você está conectado em modo de <strong>visualização</strong>. Para cadastrar, editar, enviar arquivos ou excluir registros, fale com um administrador.</span>
                </div>

                <!-- INDICADORES DE LICITAÇÕES -->
                <div v-if="abaAtiva !== 'usuarios' && moduloPrincipal === 'licitacoes' && podeAcessarLicitacoes" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-5">
                        <div class="text-slate-400 text-xs uppercase font-semibold">Editais Ativos</div>
                        <div class="text-3xl font-bold text-white mt-1">{{ licitacoesAtivas }}</div>
                        <div class="text-xs text-slate-500 mt-1">Em análise ou disputa</div>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-5">
                        <div class="text-slate-400 text-xs uppercase font-semibold">Total Arrematado</div>
                        <div class="text-2xl font-bold text-emerald-400 mt-1">{{ formatarMoeda(totalArrematado) }}</div>
                        <div class="text-xs text-slate-500 mt-1">Contratos homologados/ganhos</div>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-5">
                        <div class="text-slate-400 text-xs uppercase font-semibold">Clientes Assessorados</div>
                        <div class="text-3xl font-bold text-sky-400 mt-1">{{ clientes.length }}</div>
                        <div class="text-xs text-slate-500 mt-1">Empresas cadastradas</div>
                    </div>
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-5">
                        <div class="text-slate-400 text-xs uppercase font-semibold">Alertas de CND</div>
                        <div class="text-3xl font-bold mt-1" :class="alertasCnd > 0 ? 'text-rose-500' : 'text-emerald-400'">
                            {{ alertasCnd }}
                        </div>
                        <div class="text-xs text-slate-500 mt-1">Vencidas ou vencendo em 10 dias</div>
                    </div>
                </div>

                <!-- INDICADORES DE PRODUÇÕES CULTURAIS -->
                <div v-if="abaAtiva !== 'usuarios' && moduloPrincipal === 'cultural' && podeAcessarCultural" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div class="bg-slate-900 border border-amber-500/25 rounded-xl p-5">
                        <div class="text-amber-300/90 text-xs uppercase font-semibold">Projetos Culturais Ativos</div>
                        <div class="text-3xl font-bold text-white mt-1">{{ projetosCulturaisAtivos }}</div>
                        <div class="text-xs text-slate-500 mt-1">Inscrição, seleção, execução ou contas</div>
                    </div>
                    <div class="bg-slate-900 border border-amber-500/25 rounded-xl p-5">
                        <div class="text-amber-300/90 text-xs uppercase font-semibold">Total Contemplado</div>
                        <div class="text-2xl font-bold text-amber-400 mt-1">{{ formatarMoeda(totalContempladoCultural) }}</div>
                        <div class="text-xs text-slate-500 mt-1">Projetos contemplados / em execução</div>
                    </div>
                    <div class="bg-slate-900 border border-amber-500/25 rounded-xl p-5">
                        <div class="text-amber-300/90 text-xs uppercase font-semibold">Prazos de Edital (10d)</div>
                        <div class="text-3xl font-bold mt-1" :class="alertasPrazosCulturais > 0 ? 'text-amber-400' : 'text-emerald-400'">
                            {{ alertasPrazosCulturais }}
                        </div>
                        <div class="text-xs text-slate-500 mt-1">Inscrição, recurso ou conclusão</div>
                    </div>
                    <div class="bg-slate-900 border border-amber-500/25 rounded-xl p-5">
                        <div class="text-amber-300/90 text-xs uppercase font-semibold">Alertas de Habilitação</div>
                        <div class="text-3xl font-bold mt-1" :class="alertasHabilitacaoCultural > 0 ? 'text-rose-500' : 'text-emerald-400'">
                            {{ alertasHabilitacaoCultural }}
                        </div>
                        <div class="text-xs text-slate-500 mt-1">Certidões vencidas ou em até 10 dias</div>
                    </div>
                </div>

                <!-- ==================== ABA PREGÕES & EDITAIS ==================== -->
                <section v-if="abaAtiva === 'licitacoes' && podeAcessarLicitacoes" class="space-y-4">
                    <div class="flex flex-wrap justify-between items-center gap-4">
                        <div class="flex flex-wrap items-center gap-3">
                            <h2 class="text-lg font-bold text-white">Controle de Pregões e Editais</h2>
                            <span class="text-xs bg-slate-900 border border-slate-800 text-slate-300 px-2.5 py-1 rounded-full">
                                Exibindo {{ licitacoesFiltradas.length }} de {{ licitacoes.length }}
                            </span>
                            <button v-if="temFiltroAtivo" @click="limparFiltrosColunas"
                                class="text-xs bg-slate-800 hover:bg-slate-700 text-amber-300 border border-amber-500/30 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
                                <i class="fa-solid fa-filter-circle-xmark"></i> Limpar Filtros
                            </button>
                        </div>
                        <button v-if="isAdmin" @click="abrirNovoEdital" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-4 py-2 rounded-lg text-sm flex items-center gap-2 transition">
                            <i class="fa-solid fa-plus"></i> Novo Edital
                        </button>
                    </div>

                    <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-x-auto">
                        <table class="w-full text-left border-collapse min-w-[1150px]">
                            <thead>
                                <tr class="border-b border-slate-800 text-xs uppercase text-slate-400 bg-slate-900/70">
                                    <th class="p-3.5 align-top">
                                        <div class="mb-2">Datas (Escl. / Disputa)</div>
                                        <div class="flex items-center gap-1">
                                            <input type="date" v-model="filtros.data" title="Filtrar por data de esclarecimento ou disputa"
                                                class="w-full bg-slate-950 border border-slate-700 rounded px-2 py-1 text-[11px] text-slate-200 normal-case" @click="$event.target.showPicker && $event.target.showPicker()">
                                        </div>
                                    </th>
                                    <th class="p-3.5 align-top">
                                        <div class="mb-2">Cliente</div>
                                        <input type="text" v-model="filtros.cliente" placeholder="Filtrar cliente..."
                                            class="w-full bg-slate-950 border border-slate-700 rounded px-2 py-1 text-[11px] text-slate-200 normal-case">
                                    </th>
                                    <th class="p-3.5 align-top">
                                        <div class="mb-2">Órgão / Edital / Link</div>
                                        <input type="text" v-model="filtros.edital" placeholder="Órgão, edital, portal..."
                                            class="w-full bg-slate-950 border border-slate-700 rounded px-2 py-1 text-[11px] text-slate-200 normal-case">
                                    </th>
                                    <th class="p-3.5 align-top">
                                        <div class="mb-2">Objeto</div>
                                        <input type="text" v-model="filtros.objeto" placeholder="Filtrar objeto..."
                                            class="w-full bg-slate-950 border border-slate-700 rounded px-2 py-1 text-[11px] text-slate-200 normal-case">
                                    </th>
                                    <th class="p-3.5 align-top">
                                        <div class="mb-2">Valores (Ref / Est / Ganho)</div>
                                        <input type="number" step="0.01" v-model.number="filtros.valorMin" placeholder="Valor mín. (R$)..."
                                            class="w-full bg-slate-950 border border-slate-700 rounded px-2 py-1 text-[11px] text-slate-200 normal-case">
                                    </th>
                                    <th class="p-3.5 align-top">
                                        <div class="mb-2">Status</div>
                                        <select v-model="filtros.status"
                                            class="w-full bg-slate-950 border border-slate-700 rounded px-2 py-1 text-[11px] text-slate-200 normal-case">
                                            <option value="">Todos</option>
                                            <option v-for="st in statusOptions" :key="st" :value="st">{{ st }}</option>
                                        </select>
                                    </th>
                                    <th v-if="isAdmin" class="p-3.5 align-top text-right">
                                        <div class="mb-2">Ações</div>
                                        <span class="text-[10px] text-slate-500 normal-case">Editar / Excluir</span>
                                    </th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800 text-sm">
                                <tr v-if="licitacoesFiltradas.length === 0">
                                    <td :colspan="isAdmin ? 7 : 6" class="p-8 text-center text-slate-500">
                                        Nenhuma licitação encontrada para os critérios atuais.
                                    </td>
                                </tr>
                                <tr v-for="lic in licitacoesFiltradas" :key="lic.id" class="hover:bg-slate-800/40 transition align-top">
                                    <td class="p-3.5 whitespace-nowrap font-mono text-xs space-y-1.5">
                                        <div>
                                            <span class="text-[10px] uppercase text-amber-400/90 block">Esclarecimento</span>
                                            <span class="text-amber-300">{{ formatarDataHora(lic.data_esclarecimento) }}</span>
                                        </div>
                                        <div>
                                            <span class="text-[10px] uppercase text-emerald-400/90 block">Disputa</span>
                                            <span class="text-emerald-400 font-semibold">{{ formatarDataHora(lic.data_disputa) }}</span>
                                        </div>
                                    </td>
                                    <td class="p-3.5 font-medium text-white">
                                        {{ lic.cliente_nome || nomeCliente(lic.cliente_id) }}
                                    </td>
                                    <td class="p-3.5 space-y-1">
                                        <div class="font-semibold text-slate-200">{{ lic.orgao }}</div>
                                        <div class="text-xs text-slate-400">Edital: {{ lic.numero_edital }} • {{ lic.portal || 'Portal N/I' }}</div>
                                        <div v-if="lic.link_edital" class="pt-0.5">
                                            <a :href="normalizarUrl(lic.link_edital)" target="_blank" rel="noopener noreferrer"
                                                class="inline-flex items-center gap-1.5 text-xs font-medium text-sky-400 hover:text-sky-300 underline decoration-sky-500/40">
                                                <i class="fa-solid fa-arrow-up-right-from-square text-[11px]"></i> Abrir Edital
                                            </a>
                                        </div>
                                    </td>
                                    <td class="p-3.5 max-w-xs text-slate-300 text-xs leading-relaxed">
                                        <div class="line-clamp-3" :title="lic.objeto">{{ lic.objeto }}</div>
                                    </td>
                                    <td class="p-3.5 whitespace-nowrap text-xs space-y-0.5">
                                        <div class="text-sky-300">Ref: <span class="font-semibold">{{ formatarMoeda(lic.valor_referencia) }}</span></div>
                                        <div class="text-slate-400">Est: {{ formatarMoeda(lic.valor_estimado) }}</div>
                                        <div v-if="lic.valor_arrematado > 0" class="text-emerald-400 font-semibold">
                                            Ganho: {{ formatarMoeda(lic.valor_arrematado) }}
                                        </div>
                                    </td>
                                    <td class="p-3.5">
                                        <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-lg border text-xs font-semibold shadow-sm"
                                            :class="estiloBadgeStatus(lic.status)">
                                            <span class="w-2 h-2 rounded-full" :class="pontoStatus(lic.status)"></span>
                                            <select v-if="isAdmin" v-model="lic.status" @change="atualizarStatusLicitacao(lic)"
                                                class="bg-transparent focus:outline-none cursor-pointer pr-1 font-semibold">
                                                <option v-for="st in statusOptions" :key="st" :value="st" class="bg-slate-900 text-slate-100">
                                                    {{ st }}
                                                </option>
                                            </select>

        ];

        createApp({
            data() {
                return {
                    carregandoSessao: true,
                    usuario: null,
                    loginForm: { email: '', senha: '' },
                    erroAuth: '',
                    enviandoAuth: false,
                    senhaForm: { novaSenha: '', confirmarSenha: '' },
                    erroSenha: '',
                    enviandoSenha: false,
                    usuarios: [],
                    novoUsuario: {
                        nome: '',
                        email: '',
                        senha_provisoria: '',
                        perfil: 'viewer',
                        acesso_licitacoes: true,
                        acesso_cultural: true
                    },
                    logoSrc: '/static/img/logo.jpeg',
                    moduloPrincipal: 'licitacoes',
                    abaAtiva: 'licitacoes',
                    clientes: [],
                    licitacoes: [],
                    projetosCulturais: [],
                    municipiosRS: MUNICIPIOS_RS,
                    statusCulturais: [
                        'Em Elaboração',
                        'Inscrição Enviada',
                        'Em Seleção / Habilitação',
                        'Recurso',
                        'Contemplado',
                        'Em Execução',
                        'Prestação de Contas',
                        'Concluído',
                        'Não Contemplado / Arquivado'
                    ],
                    etapasCronograma: [
                        { key: 'abertura', label: 'Abertura do Edital' },
                        { key: 'impugnacao', label: 'Impugnação' },
                        { key: 'envio_proposta', label: 'Envio de Proposta' },
                        { key: 'selecao', label: 'Seleção' },
                        { key: 'recurso', label: 'Recurso' },
                        { key: 'classificacao', label: 'Classificação' },
                        { key: 'habilitacao', label: 'Habilitação' },
                        { key: 'execucao', label: 'Execução' },
                        { key: 'prestacao_contas', label: 'Prestação de Contas' }
                    ],
                    filtrosCulturais: {
                        busca: '',
                        municipio: '',
                        status: ''
                    },
                    modalProjetoCultural: false,
                    novoProjetoCultural: this.estadoInicialProjetoCultural(),
                    projetoDetalhe: null,
                    novaCertidaoCultural: { nome: '', data_vencimento: '', arquivo: null },
                    novoCustoCultural: { item: '', quantidade: 1, valor_unitario: 0 },
                    novoDocumentoCultural: { categoria: 'Nota Fiscal', descricao: '', url_externa: '', arquivo: null },
                    filtros: {
                        data: '',
                        cliente: '',
                        edital: '',
                        objeto: '',
                        valorMin: null,
                        status: ''
                    },
                    statusOptions: [
                        'Analisando Edital',
                        'Documentação OK',
                        'Proposta Cadastrada',
                        'Em Disputa',
                        'Habilitação / Recurso',
                        'Ganho / Homologado',
                        'Perdido / Cancelado'
                    ],
                    modalCliente: false,
                    modalLicitacao: false,
                    licitacaoEditando: null,
                    novoCliente: {
                        razao_social: '', cnpj: '', cnae_principal: '', contato: '',
                        validade_cnd_federal: '', validade_cnd_estadual: '',
                        validade_cnd_fgts: '', validade_cnd_trabalhista: ''
                    },
                    novaLicitacao: this.estadoInicialLicitacao(),
                    calc: {
                        custo: 1000,
                        frete: 150,
                        impostos: 12,
                        margem: 15
                    }
                }
            },
            computed: {
                isAdmin() {
                    return this.usuario && this.usuario.perfil === 'admin';
                },
                podeAcessarLicitacoes() {
                    if (!this.usuario) return false;
                    return this.usuario.acesso_licitacoes !== false;
                },
                podeAcessarCultural() {
                    if (!this.usuario) return false;
                    return Boolean(this.usuario.acesso_cultural);
                },
                temFiltroAtivo() {
                    return Boolean(
                        this.filtros.data ||
                        (this.filtros.cliente && this.filtros.cliente.trim()) ||
                        (this.filtros.edital && this.filtros.edital.trim()) ||
                        (this.filtros.objeto && this.filtros.objeto.trim()) ||
                        (this.filtros.valorMin !== null && this.filtros.valorMin !== '' && !isNaN(this.filtros.valorMin)) ||
                        this.filtros.status
                    );
                },
                licitacoesFiltradas() {
                    const lista = [...this.licitacoes].sort((a, b) => (a.data_disputa || '').localeCompare(b.data_disputa || ''));

                    return lista.filter(lic => {
                        if (this.filtros.data) {
                            const escData = (lic.data_esclarecimento || '').slice(0, 10);
                            const dispData = (lic.data_disputa || '').slice(0, 10);
                            if (escData !== this.filtros.data && dispData !== this.filtros.data) {
                                return false;
                            }
                        }

                        if (this.filtros.cliente && this.filtros.cliente.trim()) {
                            const nomeCli = (lic.cliente_nome || this.nomeCliente(lic.cliente_id)).toLowerCase();
                            if (!nomeCli.includes(this.filtros.cliente.trim().toLowerCase())) {
                                return false;
                            }
                        }

                        if (this.filtros.edital && this.filtros.edital.trim()) {
                            const termo = this.filtros.edital.trim().toLowerCase();
                            const alvo = `${lic.orgao || ''} ${lic.numero_edital || ''} ${lic.portal || ''} ${lic.link_edital || ''}`.toLowerCase();
                            if (!alvo.includes(termo)) {
                                return false;
                            }
                        }

                        if (this.filtros.objeto && this.filtros.objeto.trim()) {
                            if (!(lic.objeto || '').toLowerCase().includes(this.filtros.objeto.trim().toLowerCase())) {
                                return false;
                            }
                        }

                        if (this.filtros.valorMin !== null && this.filtros.valorMin !== '' && !isNaN(this.filtros.valorMin)) {
                            const min = parseFloat(this.filtros.valorMin) || 0;
                            const maiorValor = Math.max(
                                parseFloat(lic.valor_referencia) || 0,
                                parseFloat(lic.valor_estimado) || 0,
                                parseFloat(lic.valor_arrematado) || 0
                            );
                            if (maiorValor < min) {
                                return false;
                            }
                        }

                        if (this.filtros.status && lic.status !== this.filtros.status) {
                            return false;
                        }

                        return true;
                    });
                },
                licitacoesAtivas() {
                    return this.licitacoes.filter(l => !['Ganho / Homologado', 'Perdido / Cancelado'].includes(l.status)).length;
                },
                totalArrematado() {
                    return this.licitacoes
                        .filter(l => l.status === 'Ganho / Homologado')
                        .reduce((acc, l) => acc + (parseFloat(l.valor_arrematado) || 0), 0);
                },
                alertasCnd() {
                    let count = 0;
                    const hoje = new Date();
                    const limite = new Date();
                    limite.setDate(hoje.getDate() + 10);

                    this.clientes.forEach(c => {
                        [c.validade_cnd_federal, c.validade_cnd_estadual, c.validade_cnd_fgts, c.validade_cnd_trabalhista].forEach(dt => {
                            if (dt && new Date(dt + 'T23:59:59') <= limite) count++;
                        });
                    });
                    return count;
                },
                projetosCulturaisFiltrados() {
                    return this.projetosCulturais.filter(p => {
                        if (this.filtrosCulturais.municipio && p.municipio_rs !== this.filtrosCulturais.municipio) return false;
                        if (this.filtrosCulturais.status && p.status !== this.filtrosCulturais.status) return false;
                        if (this.filtrosCulturais.busca && this.filtrosCulturais.busca.trim()) {
                            const q = this.filtrosCulturais.busca.trim().toLowerCase();
                            const alvo = `${p.titulo || ''} ${p.edital || ''} ${p.proponente || ''} ${p.municipio_rs || ''}`.toLowerCase();
                            if (!alvo.includes(q)) return false;
                        }
                        return true;
                    });
                },
                projetosCulturaisAtivos() {
                    return this.projetosCulturais.filter(p => !['Concluído', 'Não Contemplado / Arquivado'].includes(p.status)).length;
                },
                totalContempladoCultural() {
                    return this.projetosCulturais
                        .filter(p => ['Contemplado', 'Em Execução', 'Prestação de Contas', 'Concluído'].includes(p.status))
                        .reduce((acc, p) => acc + (parseFloat(p.valor_contemplado) || 0), 0);
                },
                alertasPrazosCulturais() {
                    let count = 0;
                    const hoje = new Date();
                    hoje.setHours(0, 0, 0, 0);
                    const limite = new Date(hoje);
                    limite.setDate(hoje.getDate() + 10);
                    this.projetosCulturais.forEach(p => {
                        [p.data_fim_inscricao, p.data_recurso, p.prazo_conclusao].forEach(dt => {
                            if (dt) {
                                const d = new Date(dt + 'T23:59:59');
                                if (d <= limite) count++;
                            }
                        });
                    });
                    return count;
                },
                alertasHabilitacaoCultural() {
                    let count = 0;
                    const hoje = new Date();
                    hoje.setHours(0, 0, 0, 0);
                    const limite = new Date(hoje);
                    limite.setDate(hoje.getDate() + 10);
                    this.projetosCulturais.forEach(p => {
                        (p.certidoes || []).forEach(c => {
                            if (c.data_vencimento) {
                                const d = new Date(c.data_vencimento + 'T23:59:59');
                                if (d <= limite) count++;
                            }
                        });
                    });
                    return count;
                },
                totalCustosProjeto() {
                    if (!this.projetoDetalhe || !Array.isArray(this.projetoDetalhe.custos)) return 0;
                    return this.projetoDetalhe.custos.reduce((acc, item) => acc + ((parseFloat(item.quantidade) || 0) * (parseFloat(item.valor_unitario) || 0)), 0);
                },
                lanceMinimoCalculado() {
                    const custoTotal = (this.calc.custo || 0) + (this.calc.frete || 0);
                    const percentualTotal = ((this.calc.impostos || 0) + (this.calc.margem || 0)) / 100;
                    if (percentualTotal >= 1) return 0;
                    return custoTotal / (1 - percentualTotal);
                }
            },
            methods: {
                async apiFetch(url, options = {}) {
                    const isFormData = options.body instanceof FormData;
                    const headers = isFormData ? { ...(options.headers || {}) } : { 'Content-Type': 'application/json', ...(options.headers || {}) };
                    const resp = await fetch(url, { ...options, headers });
                    const data = await resp.json().catch(() => ({}));
                    if (resp.status === 401) {
                        this.usuario = null;
                        throw new Error(data.error || 'Sessão expirada');
                    }
                    if (resp.status === 428 && data.precisa_trocar_senha) {
                        if (this.usuario) this.usuario.precisa_trocar_senha = true;
                        throw new Error(data.error || 'Troca de senha obrigatória');
                    }
                    if (!resp.ok) {
                        throw new Error(data.error || 'Erro na requisição');
                    }
                    return data;
                },
                selecionarModuloPrincipal(modulo) {
                    this.moduloPrincipal = modulo;
                    if (modulo === 'licitacoes') {
                        this.abaAtiva = 'licitacoes';
                    } else if (modulo === 'cultural') {
                        this.abaAtiva = 'cultural';
                    }
                },
                async verificarSessao() {
                    this.carregandoSessao = true;
                    try {
                        const resp = await fetch('/api/auth/me');
                        const data = await resp.json();
                        this.usuario = data.authenticated ? data.user : null;
                        if (this.usuario && !this.usuario.precisa_trocar_senha) {
                            if (this.podeAcessarLicitacoes) {
                                this.moduloPrincipal = 'licitacoes';
                                this.abaAtiva = 'licitacoes';
                            } else if (this.podeAcessarCultural) {
                                this.moduloPrincipal = 'cultural';
                                this.abaAtiva = 'cultural';
                            }
                            await this.carregarDadosSistema();
                        }
                    } catch (_) {
                        this.usuario = null;
                    } finally {
                        this.carregandoSessao = false;
                    }
                },
                async fazerLogin() {
                    this.erroAuth = '';
                    this.enviandoAuth = true;
                    try {
                        const data = await this.apiFetch('/api/auth/login', {
                            method: 'POST',
                            body: JSON.stringify(this.loginForm)
                        });
                        this.usuario = data.user;
                        this.loginForm.senha = '';
                        if (!this.usuario.precisa_trocar_senha) {
                            if (this.podeAcessarLicitacoes) {
                                this.moduloPrincipal = 'licitacoes';
                                this.abaAtiva = 'licitacoes';
                            } else if (this.podeAcessarCultural) {
                                this.moduloPrincipal = 'cultural';
                                this.abaAtiva = 'cultural';
                            }
                            await this.carregarDadosSistema();
                        }
                    } catch (err) {
                        this.erroAuth = err.message;
                    } finally {
                        this.enviandoAuth = false;
                    }
                },
                async salvarNovaSenha() {
                    this.erroSenha = '';
                    if (this.senhaForm.novaSenha !== this.senhaForm.confirmarSenha) {
                        this.erroSenha = 'As senhas não conferem.';
                        return;
                    }
                    this.enviandoSenha = true;
                    try {
                        await this.apiFetch('/api/auth/trocar-senha', {
                            method: 'POST',
                            body: JSON.stringify({ nova_senha: this.senhaForm.novaSenha })
                        });
                        this.usuario.precisa_trocar_senha = false;
                        this.senhaForm = { novaSenha: '', confirmarSenha: '' };
                        await this.carregarDadosSistema();
                    } catch (err) {
                        this.erroSenha = err.message;
                    } finally {
                        this.enviandoSenha = false;
                    }
                },
                async sair() {
                    try {
                        await fetch('/api/auth/logout', { method: 'POST' });
                    } catch (_) {}
                    this.usuario = null;
                    this.clientes = [];
                    this.licitacoes = [];
                    this.projetosCulturais = [];
                    this.usuarios = [];
                    this.projetoDetalhe = null;
                    this.abaAtiva = 'licitacoes';
                },
                async carregarDadosSistema() {
                    const requests = [];
                    if (this.podeAcessarLicitacoes) {
                        requests.push(this.apiFetch('/api/clientes').then(d => { this.clientes = d || []; }));
                        requests.push(this.apiFetch('/api/licitacoes').then(d => {
                            this.licitacoes = (d || []).map(l => ({
                                link_edital: '',
                                data_esclarecimento: '',
                                valor_referencia: 0,
                                valor_estimado: 0,
                                valor_arrematado: 0,
                                ...l
                            }));
                        }));
                    }
                    if (this.podeAcessarCultural) {
                        requests.push(this.apiFetch('/api/culturais').then(d => {
                            this.projetosCulturais = (d || []).map(p => ({
                                cronograma: {},
                                certidoes: [],
                                custos: [],
                                documentos: [],
                                ...p
                            }));
                        }));
                    }
                    await Promise.all(requests);
                    if (this.isAdmin) {
                        await this.carregarUsuarios();
                    }

                    const d = new Date(dt);
                    if (isNaN(d.getTime())) return dt;
                    return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                },
                statusValidade(dataStr) {
                    if (!dataStr) return { texto: 'Não inf.', classe: 'text-slate-500' };
                    const hoje = new Date();
                    hoje.setHours(0, 0, 0, 0);
                    const val = new Date(dataStr + 'T00:00:00');
                    const diffDias = Math.ceil((val - hoje) / (1000 * 60 * 60 * 24));
                    const dataFmt = val.toLocaleDateString('pt-BR');

                    if (diffDias < 0) return { texto: `${dataFmt} (Vencida)`, classe: 'text-rose-500' };
                    if (diffDias <= 10) return { texto: `${dataFmt} (${diffDias}d)`, classe: 'text-amber-400' };
                    return { texto: dataFmt, classe: 'text-emerald-400' };
                },
                estiloBadgeStatus(status) {
                    const mapa = {
                        'Analisando Edital': 'bg-slate-800/90 border-slate-600 text-slate-200',
                        'Documentação OK': 'bg-cyan-950/70 border-cyan-500/50 text-cyan-300',
                        'Proposta Cadastrada': 'bg-indigo-950/70 border-indigo-500/50 text-indigo-300',
                        'Em Disputa': 'bg-sky-950/80 border-sky-400/60 text-sky-300',
                        'Habilitação / Recurso': 'bg-amber-950/70 border-amber-500/50 text-amber-300',
                        'Ganho / Homologado': 'bg-emerald-950/80 border-emerald-500/60 text-emerald-300',
                        'Perdido / Cancelado': 'bg-rose-950/75 border-rose-500/60 text-rose-300'
                    };
                    return mapa[status] || 'bg-slate-800 border-slate-700 text-slate-300';
                },
                pontoStatus(status) {
                    const mapa = {
                        'Analisando Edital': 'bg-slate-400',
                        'Documentação OK': 'bg-cyan-400',
                        'Proposta Cadastrada': 'bg-indigo-400',
                        'Em Disputa': 'bg-sky-400 animate-pulse',
                        'Habilitação / Recurso': 'bg-amber-400',
                        'Ganho / Homologado': 'bg-emerald-400',
                        'Perdido / Cancelado': 'bg-rose-500'
                    };
                    return mapa[status] || 'bg-slate-400';
                }
            },
            mounted() {
                this.carregarLogoSalva();
                this.verificarSessao();
            }
        }).mount('#app');
    </script>
</body>
</html>
